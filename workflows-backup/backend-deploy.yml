name: Backend Deploy

on:
  push:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déployer le backend sur le serveur distant via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            # Créer le réseau Docker s'il n'existe pas
            docker network create comptel-net || true
            # Pull la dernière image du backend depuis Docker Hub
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/comptel-backend:latest
            # Stopper et supprimer l'ancien conteneur s'il existe
            docker stop comptel-backend || true
            docker rm comptel-backend || true
            # Lancer le nouveau conteneur backend
            docker run -d --name comptel-backend \
              -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/comptel \
              -e SPRING_DATASOURCE_USERNAME=${{ secrets.POSTGRES_USER }} \
              -e SPRING_DATASOURCE_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
              -p 8080:8080 \
              --network comptel-net \
              ${{ secrets.DOCKERHUB_USERNAME }}/comptel-backend:latest 