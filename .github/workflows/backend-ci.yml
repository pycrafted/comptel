name: Backend CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  backend-quality-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: comptel
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Lint backend (Checkstyle)
        run: mvn checkstyle:check --file backend/pom.xml

      - name: Build and test with Maven (JaCoCo)
        run: |
          cd backend
          mvn clean verify -Dspring.datasource.url=jdbc:postgresql://localhost:5432/comptel -Dspring.datasource.username=postgres -Dspring.datasource.password=${{ secrets.POSTGRES_PASSWORD }}

      - name: Upload backend coverage report (JaCoCo)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

      - name: Upload JUnit test results
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: backend/target/surefire-reports/

      - name: Static code analysis (SpotBugs)
        run: mvn com.github.spotbugs:spotbugs-maven-plugin:spotbugs --file backend/pom.xml

      - name: Scan Maven dependencies (Trivy)
        uses: aquasecurity/trivy-action@v0.16.0
        with:
          scan-type: fs
          scan-ref: ./backend
          format: table
          exit-code: 0
          ignore-unfixed: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/target/site/jacoco/jacoco.xml
          flags: backend
          fail_ci_if_error: false

      - name: Fail if JaCoCo coverage < 80%
        run: |
          COVERAGE=$(xmllint --xpath "string(//report/counter[@type='INSTRUCTION']/@covered)" backend/target/site/jacoco/jacoco.xml)
          MISSED=$(xmllint --xpath "string(//report/counter[@type='INSTRUCTION']/@missed)" backend/target/site/jacoco/jacoco.xml)
          TOTAL=$((COVERAGE + MISSED))
          if [ "$TOTAL" -eq 0 ]; then echo "No coverage data found"; exit 1; fi
          PERCENT=$(( 100 * COVERAGE / TOTAL ))
          echo "Coverage: $PERCENT%"
          if [ "$PERCENT" -lt 80 ]; then echo "Coverage below 80%!"; exit 1; fi
        shell: bash
        env:
          COVERAGE_FILE: backend/target/site/jacoco/jacoco.xml
        continue-on-error: false

  notify-on-failure:
    needs: backend-quality-test
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Gmail notification on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: "[CI] Echec du build Backend Comptel"
          to: abdoulayelah@esp.sn, moustaf478@gmail.com, ndeyekharytoure@esp.sn, khadijatouba@esp.sn
          from: ${{ secrets.GMAIL_USER }}
          body: |
            Le build CI du backend Comptel a échoué.
            Repo: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Auteur: ${{ github.actor }}
            Lien vers le run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}