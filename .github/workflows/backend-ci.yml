name: Backend & Frontend CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'
        distribution: 'adopt'

    - name: Lint backend (Checkstyle)
      run: mvn checkstyle:check --file backend/pom.xml

    - name: Build backend with Maven (JaCoCo)
      run: mvn -B clean verify --file backend/pom.xml

    - name: Upload backend coverage report (JaCoCo)
      uses: actions/upload-artifact@v3
      with:
        name: jacoco-report
        path: backend/target/site/jacoco

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install frontend dependencies
      run: npm install
      working-directory: frontend

    - name: Lint frontend (eslint)
      run: npx eslint .
      working-directory: frontend

    - name: Run frontend tests with coverage
      run: npm test -- --coverage --watchAll=false
      working-directory: frontend

    - name: Upload frontend coverage report
      uses: actions/upload-artifact@v3
      with:
        name: frontend-coverage
        path: frontend/coverage

    - name: Build frontend
      run: npm run build
      working-directory: frontend

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: backend/target/site/jacoco/jacoco.xml,frontend/coverage/lcov.info
        flags: backend,frontend
        fail_ci_if_error: false