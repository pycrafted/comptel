name: OWASP ZAP API Scan

on:
  push:
    branches: [ develop ]

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    services:
      backend:
        image: ${{ secrets.DOCKERHUB_USERNAME }}/comptel-backend:latest
        ports:
          - 8080:8080
        options: >-
          --health-cmd "curl -f http://localhost:8080/actuator/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Attendre que le backend soit prêt
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/actuator/health | grep UP; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Lancer un scan OWASP ZAP
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080/'
          fail_action: false
          report_html: true
      - name: Upload ZAP report
        uses: actions/upload-artifact@v3
        with:
          name: zap-report
          path: report_html.html 