# Configuration Render pour l'application Comptel
# Ce fichier définit tous les services nécessaires pour le déploiement

databases:
  - name: comptel-db
    databaseName: comptel
    user: comptel_user
    plan: free

services:
  # Service Backend Spring Boot
  - type: web
    name: comptel-backend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: comptel-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: comptel-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: comptel-db
          property: password
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: false
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        value: health,info,metrics
      - key: SERVER_PORT
        value: 8080
    autoDeploy: true

  # Service Frontend React
  - type: web
    name: comptel-frontend
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /
    envVars:
      - key: REACT_APP_API_URL
        value: https://comptel-backend.onrender.com
      - key: NODE_ENV
        value: production
    autoDeploy: true 