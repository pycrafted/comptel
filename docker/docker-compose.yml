version: '3.8'

services:
  # Base de données PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: comptel-postgres
    environment:
      POSTGRES_DB: comptel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - comptel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comptel"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: comptel-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/comptel
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: false
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - comptel-network
    restart: unless-stopped

  # Frontend React
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: comptel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - comptel-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  comptel-network:
    driver: bridge 